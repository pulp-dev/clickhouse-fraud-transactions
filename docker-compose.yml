services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"   # доступ с хоста (localhost:9092)
    environment:
      # KRaft-режим: один узел является и брокером, и контроллером (Zookeeper не нужен)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # однонодовый кластер — фактор репликации служебных топиков 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топик создаём явно в producer.py
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP-интерфейс ClickHouse
      - "9000:9000"   # нативный протокол ClickHouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", " wget --spider -q http://localhost:8123/ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    environment:
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: password
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build: ./producer
    container_name: producer

    # параметры можно переопределить: RPS=100 LIMIT=1000 docker compose run --rm producer
    profiles: ["producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transactions}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      CSV_PATH: /data/train.csv
      # сообщений в секунду, 0 — без ограничения
      RPS: ${RPS:-5000}
      # отправить первые N записей, 0 — все
      LIMIT: ${LIMIT:-0}
      # отправлять в хронологическом порядке
      SORT_BY_TIME: ${SORT_BY_TIME:-true}
    volumes:
      - ./data:/data:ro
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka_data:
  clickhouse_data:
